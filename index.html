<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Source+Sans+3:wght@400;600&family=Noto+Sans+TC:wght@400;600&family=Noto+Serif+TC:wght@600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #faf6ee; --panel: #fffdf8; --ink: #2b2621; --muted: #6f6556; --line: #e6ddcc; --accent: #9a4b1c; --accent-soft: #f5e4d2;
  --display: "Source Serif 4", "Noto Serif TC", Georgia, serif;
  --body: "Source Sans 3", "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #1f1a16; --panel: #28221d; --ink: #f1e8da; --muted: #b9ab97; --line: #40372e; --accent: #f0a46c; --accent-soft: #45321f; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); }
main { max-width: 640px; margin: 0 auto; padding: 56px 20px; }
h1 { font: 600 30px/1.2 var(--display); margin: 0 0 6px; letter-spacing: -.01em; }
h1 span { color: var(--accent); }
.lede { color: var(--muted); margin: 0 0 32px; }
ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
a.pack { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 16px; padding: 16px 18px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; }
a.pack:hover { border-color: var(--accent); }
a.pack:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.name { font: 600 19px/1.3 var(--display); }
.desc { grid-column: 1; color: var(--muted); font-size: 14px; }
.go { grid-row: 1 / span 2; grid-column: 2; color: var(--accent); font-weight: 600; font-size: 14px; }
footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Data <span>Viewer</span></h1>
  <p class="lede">團隊的基準資料檢視器。頁面本身只有程式碼，題目和結果從私有 repo 讀取，需要團隊的唯讀 token。</p>
  <ul>
    <li><a class="pack" href="pack1/">
      <span class="name" lang="en">Pack 1</span>
      <span class="desc">13 種不誠實格式、三個模型的得分、題目與回答</span>
      <span class="go" aria-hidden="true">開啟 →</span>
    </a></li>
  </ul>
  <footer>第一次開啟時，在「資料來源」貼上 token。</footer>
</main>
</body>
</html>
